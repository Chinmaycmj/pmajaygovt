<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D18"/>
      <stop offset="50%" stop-color="#141829"/>
      <stop offset="100%" stop-color="#1F1508"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6"/>

  <!-- Subtle Acoustic Rings -->
  <circle cx="256" cy="240" r="190" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.2" stroke-dasharray="8 6"/>
  <circle cx="256" cy="240" r="150" fill="none" stroke="#F59E0B" stroke-width="3" opacity="0.35"/>
  <circle cx="256" cy="240" r="110" fill="none" stroke="#10B981" stroke-width="3" opacity="0.4"/>

  <!-- Ashoka / Tiranga Aura -->
  <circle cx="256" cy="240" r="75" fill="#0B0D18" stroke="url(#goldGrad)" stroke-width="6"/>

  <!-- Microphone & Soundwave Center -->
  <!-- Tiranga Top Saffron Arc -->
  <path d="M 200 240 A 56 56 0 0 1 312 240" fill="none" stroke="url(#saffronGrad)" stroke-width="8" stroke-linecap="round"/>
  <!-- Tiranga Bottom Green Arc -->
  <path d="M 200 240 A 56 56 0 0 0 312 240" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Center Microphone Symbol -->
  <rect x="240" y="200" width="32" height="56" rx="16" fill="url(#goldGrad)"/>
  <path d="M 226 226 C 226 264 286 264 286 226" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="264" x2="256" y2="286" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <line x1="236" y1="286" x2="276" y2="286" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

  <!-- Bottom Banner: VANI SAHAYAK -->
  <rect x="76" y="380" width="360" height="64" rx="20" fill="#181B2C" stroke="url(#goldGrad)" stroke-width="3"/>
  <text x="256" y="422" fill="#FDE68A" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="2">वाणी सहायक • VANI</text>
</svg>
